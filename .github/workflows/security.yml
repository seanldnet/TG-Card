name: Security vulnerability scan

on:
  push:
    branches: [main]
    paths:
      - "go.mod"
      - "go.sum"
      - "internal/**"
      - ".github/workflows/security.yml"
  pull_request:
    branches: [main]
    paths:
      - "go.mod"
      - "go.sum"
      - "internal/**"
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: Scan Go dependencies and reachable code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - name: Check known Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
