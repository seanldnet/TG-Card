services:
  app:
    image: ghcr.io/seanldnet/tg-card:latest
    container_name: tg-card
    restart: unless-stopped
    ports:
      - "38647:38647"
    environment:
      APP_ENV: production
      PORT: "38647"
      DB_DRIVER: postgres
      DATABASE_URL: postgres://tgcard:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/tgcard?sslmode=disable
    volumes:
      - tg_card_data:/app/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: tg-card-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: tgcard
      POSTGRES_USER: tgcard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tgcard -d tgcard"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  tg_card_data:
  postgres_data:
