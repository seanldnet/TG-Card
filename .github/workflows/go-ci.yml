name: Go backend CI

on:
  push:
    branches: [main]
    paths:
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "scripts/**"
      - ".github/workflows/go-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "scripts/**"
      - ".github/workflows/go-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tgcard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tgcard_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/tgcard_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated Docker Compose backup/restore integration test\n        run: bash scripts/test-backup-restore.sh
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - run: go mod tidy
      - run: gofmt -w cmd internal
      - run: go vet ./...
      - run: go test ./...
      - run: CGO_ENABLED=0 go build -trimpath -o tg-card ./cmd/server
